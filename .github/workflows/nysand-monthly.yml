name: NYSAND Monthly Build

on:
  schedule:
    # Run at 02:15 AM UTC on the 1st of each month
    - cron: "15 2 1 * *"
  workflow_dispatch: {}  # allow manual runs anytime

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Echo endpoint (sanity)
        env:
          EATR_ENDPOINT_URL: ${{ secrets.EATR_ENDPOINT_URL }}
        run: |
          python - << 'PY'
          import os
          from urllib.parse import urlparse
          u = os.environ.get("EATR_ENDPOINT_URL","")
          p = urlparse(u)
          print(f"endpoint: scheme={p.scheme or '(none)'} host={p.netloc or '(none)'} path={p.path or '(none)'}")
          PY
        

      - name: Run headless generator
        env:
          EATR_ACCESS_KEY: ${{ secrets.EATR_ACCESS_KEY }}
          EATR_GROUP_KEY:  ${{ secrets.EATR_GROUP_KEY }}
          EATR_ENDPOINT_URL: ${{ secrets.EATR_ENDPOINT_URL }}
        run: |
          python tools/generate_region_zip.py --out out/NYSAND_Member_Files.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NYSAND_Member_Files
          path: out/NYSAND_Member_Files.zip
