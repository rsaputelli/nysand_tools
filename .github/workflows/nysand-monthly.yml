name: NYSAND Monthly Build

on:
  schedule:
    - cron: "15 2 1 * *"  # 02:15 UTC on the 1st of each month
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo (release)
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          # Ensure these are present even if not pinned
          pip install pandas requests xmltodict openpyxl

      - name: Sanity check repo layout
        run: |
          echo "::group::ls -la"
          ls -la
          echo "::endgroup::"
          echo "::group::ls -la assets"
          ls -la assets || true
          echo "::endgroup::"
          echo "::group::ls -la tools"
          ls -la tools || true
          echo "::endgroup::"

      - name: Verify region map exists
        run: |
          test -f assets/nysand_region_zips.xlsx || (echo "::error::Missing assets/nysand_region_zips.xlsx" && exit 1)
          mkdir -p out

      - name: Echo endpoint (sanity)
        env:
          EATR_ENDPOINT_URL: http://ws.eatright.org/service/service.svc
        run: |
          echo "EATR_ENDPOINT_URL='${EATR_ENDPOINT_URL}'"

      - name: Run headless generator
        env:
          EATR_ACCESS_KEY: ${{ secrets.EATR_ACCESS_KEY }}
          EATR_GROUP_KEY:  ${{ secrets.EATR_GROUP_KEY }}
          EATR_ENDPOINT_URL: http://ws.eatright.org/service/service.svc
        run: |
          set -e
          python - <<'PY'
          import os, sys
          from datetime import datetime
          print(f"[{datetime.utcnow().isoformat()}Z] Starting generator")
          print(f"ENV: ACCESS={'set' if os.getenv('EATR_ACCESS_KEY') else 'missing'}, GROUP={'set' if os.getenv('EATR_GROUP_KEY') else 'missing'}")
          print(f"ENV: ENDPOINT={os.getenv('EATR_ENDPOINT_URL','(none)')}")
          # call the real generator
          import tools.generate_region_zip as gen
          print(f"[{datetime.utcnow().isoformat()}Z] Writing ZIP to out/NYSAND_Member_Files.zip")
          # The generator already parses --out when executed as a script; here we call its logic by re-running as a module:
          os.system("python tools/generate_region_zip.py --out out/NYSAND_Member_Files.zip")
          print(f"[{datetime.utcnow().isoformat()}Z] Listing out/")
          os.system("ls -la out || true")
          PY

      - name: Fail if artifact is empty (with diagnostics)
        run: |
          if [ ! -s out/NYSAND_Member_Files.zip ]; then
            echo "::group::Diagnostics"
            ls -la out || true
            du -h out/NYSAND_Member_Files.zip || true
            echo "::endgroup::"
            echo "::error::ZIP is empty or missing"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: NYSAND_Member_Files
          path: out/NYSAND_Member_Files.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload SOAP diagnostic (if present)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soap_response_xml
          path: /tmp/soap_response.xml
          if-no-files-found: ignore
